<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crestview Capital — AI Onboarding Pipeline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }

  /* Top bar */
  .topbar { background: #1a1d2e; border-bottom: 1px solid #2d3048; padding: 12px 20px; display: flex; align-items: center; gap: 16px; }
  .logo { font-weight: 700; font-size: 15px; color: #e2e8f0; letter-spacing: 0.3px; }
  .logo span { color: #6366f1; }
  .status-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; background: #1e2535; color: #94a3b8; border: 1px solid #2d3048; }
  .status-badge.running { background: #1a2e1a; color: #4ade80; border-color: #166534; }
  .status-badge.error { background: #2e1a1a; color: #f87171; border-color: #991b1b; }
  .btn { padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity 0.15s; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn-primary { background: #6366f1; color: white; }
  .btn-primary:hover:not(:disabled) { background: #4f46e5; }
  .btn-secondary { background: #374151; color: #e2e8f0; }
  .btn-secondary:hover:not(:disabled) { background: #4b5563; }
  .spacer { flex: 1; }
  .app-select { background: #1e2535; color: #e2e8f0; border: 1px solid #2d3048; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; min-width: 220px; }
  .app-select:disabled { opacity: 0.4; cursor: default; }
  .select-label { font-size: 11px; color: #64748b; font-weight: 600; }

  /* Layout */
  .layout { display: flex; flex: 1; overflow: hidden; }

  /* Sidebar */
  .sidebar { width: 240px; background: #141827; border-right: 1px solid #2d3048; overflow-y: auto; display: flex; flex-direction: column; }
  .sidebar-header { padding: 14px 16px 8px; font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.8px; text-transform: uppercase; }
  .app-item { padding: 10px 16px; cursor: pointer; border-left: 2px solid transparent; transition: all 0.1s; }
  .app-item:hover { background: #1e2535; }
  .app-item.active { background: #1e2535; border-left-color: #6366f1; }
  .app-name { font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app-id { font-size: 11px; color: #64748b; }
  .risk-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .risk-low { background: #14532d; color: #4ade80; }
  .risk-medium { background: #7c2d12; color: #fb923c; }
  .risk-high { background: #7f1d1d; color: #f87171; }
  .risk-critical { background: #450a0a; color: #ef4444; }
  .risk-pending { background: #1e2535; color: #64748b; }

  /* Main panel */
  .main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #475569; text-align: center; gap: 8px; }
  .empty-state h2 { font-size: 18px; color: #64748b; font-weight: 600; }
  .empty-state p { font-size: 13px; max-width: 340px; line-height: 1.5; }

  /* Application card */
  .app-card { background: #141827; border: 1px solid #2d3048; border-radius: 10px; overflow: hidden; }
  .app-card-header { padding: 14px 18px; border-bottom: 1px solid #1e2535; display: flex; align-items: center; gap: 10px; }
  .app-card-title { font-size: 14px; font-weight: 700; color: #e2e8f0; }
  .app-card-id { font-size: 11px; color: #64748b; margin-left: auto; }
  .app-card-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }

  /* Stage progress */
  .stage { display: flex; align-items: flex-start; gap: 12px; }
  .stage-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
  .stage-icon.pending { background: #1e2535; color: #64748b; }
  .stage-icon.running { background: #1d2a4a; color: #818cf8; animation: pulse 1.5s infinite; }
  .stage-icon.done { background: #14532d; color: #4ade80; }
  .stage-icon.error { background: #7f1d1d; color: #f87171; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .stage-content { flex: 1; }
  .stage-label { font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 4px; }
  .stage-detail { font-size: 12px; color: #64748b; }
  .stage0 .stage-icon.done { background: #1e3a5f; color: #60a5fa; }
  .stage0 .stage-icon.running { background: #1e3a5f; color: #93c5fd; }

  /* Scores */
  .score-row { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
  .score-label { font-size: 11px; color: #94a3b8; width: 130px; flex-shrink: 0; }
  .score-bar-wrap { flex: 1; background: #1e2535; border-radius: 4px; height: 8px; overflow: hidden; }
  .score-bar { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
  .score-val { font-size: 11px; color: #94a3b8; width: 36px; text-align: right; }
  .score-bar.good { background: #4ade80; }
  .score-bar.ok { background: #fb923c; }
  .score-bar.low { background: #f87171; }

  /* Routing decision */
  .routing-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-top: 4px; }
  .routing-APPROVE { background: #14532d; color: #4ade80; }
  .routing-CONDITIONAL_APPROVE { background: #1c3a5f; color: #60a5fa; }
  .routing-ESCALATE { background: #7c2d12; color: #fb923c; }
  .routing-REJECT { background: #450a0a; color: #ef4444; }
  .routing-rationale { font-size: 11px; color: #64748b; margin-top: 4px; line-height: 1.5; }
  .reviewer-brief { border-left: 3px solid #f97316; padding: 12px 16px; margin-top: 10px; background: #1a1000; border-radius: 0 6px 6px 0; }
  .reviewer-brief h4 { color: #fb923c; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 10px 0 4px; }
  .reviewer-brief h4:first-child { margin-top: 0; }
  .reviewer-brief p { font-size: 12px; color: #cbd5e1; line-height: 1.6; margin: 0; }
  .reviewer-brief ul { margin: 4px 0 0; padding-left: 18px; }
  .reviewer-brief li { font-size: 12px; color: #cbd5e1; line-height: 1.6; margin-bottom: 2px; }
  .reviewer-brief-generating { font-size: 12px; color: #64748b; font-style: italic; }

  /* CoT reasoning */
  .cot-toggle { font-size: 11px; color: #6366f1; cursor: pointer; margin-top: 4px; user-select: none; }
  .cot-toggle:hover { color: #818cf8; }
  .cot-block { margin-top: 8px; background: #0d1117; border: 1px solid #2d3048; border-radius: 6px; padding: 12px; font-size: 11px; color: #94a3b8; font-family: 'Courier New', monospace; white-space: pre-wrap; max-height: 280px; overflow-y: auto; line-height: 1.6; display: none; }
  .cot-block.visible { display: block; }

  /* Error banner */
  .error-banner { background: #2e1a1a; border: 1px solid #991b1b; border-radius: 6px; padding: 10px 14px; font-size: 12px; color: #f87171; }

  /* Tool call log */
  .tool-call { background: #0d1117; border-left: 2px solid #6366f1; padding: 6px 10px; margin-top: 4px; font-size: 11px; color: #94a3b8; font-family: monospace; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">Crestview <span>AI</span> Onboarding</div>
  <div id="status" class="status-badge">Idle</div>
  <div class="spacer"></div>
  <span class="select-label">Application:</span>
  <select id="appSelect" class="app-select">
    <option value="">All Applications</option>
  </select>
  <button class="btn btn-secondary" id="btnPhase1" onclick="startRun(1)">Document Extraction</button>
  <button class="btn btn-primary" id="btnPhase2" onclick="startRun(2)">Compliance Check</button>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">Applications</div>
    <div id="appList"></div>
  </div>
  <div class="main" id="main">
    <div class="empty-state">
      <h2>Pipeline Ready</h2>
      <p>Click <strong>Document Extraction</strong> to extract and assess documents, or <strong>Compliance Check</strong> to run the compliance review on processed applications.</p>
    </div>
  </div>
</div>

<script>
const state = {
  apps: {},       // app_id → { card, stages, ... }
  activeApp: null,
  es: null,
};

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status-badge' + (cls ? ' ' + cls : '');
}

function setButtons(running) {
  document.getElementById('btnPhase1').disabled = running;
  document.getElementById('btnPhase2').disabled = running;
  document.getElementById('appSelect').disabled = running;
}

async function loadApplications() {
  try {
    const res = await fetch('/api/applications');
    const apps = await res.json();
    const select = document.getElementById('appSelect');
    apps.forEach(app => {
      const opt = document.createElement('option');
      opt.value = app.application_id;
      opt.textContent = `${app.client_name} (${app.application_id})`;
      select.appendChild(opt);
    });
  } catch (e) {
    console.warn('Could not load applications:', e);
  }
}

async function startRun(phase) {
  const clientId = document.getElementById('appSelect').value || null;
  setStatus('Starting…', '');
  setButtons(true);
  document.getElementById('main').innerHTML = '';
  state.apps = {};
  state.activeApp = null;

  const body = { phase, max_applications: 5 };
  if (clientId) body.client_id = clientId;

  const res = await fetch('/api/runs', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const { run_id } = await res.json();
  setStatus('Running…', 'running');
  connectStream(run_id);
}

loadApplications();

function connectStream(runId) {
  if (state.es) state.es.close();
  state.es = new EventSource(`/api/runs/${runId}/stream`);

  state.es.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    handleEvent(ev);
  };

  state.es.onerror = () => {
    setStatus('Error', 'error');
    setButtons(false);
    state.es.close();
  };
}

function handleEvent(ev) {
  const { event, application_id, stage, data } = ev;

  if (event === 'run_complete' && application_id === 'pipeline') {
    setStatus(`Done — ${data.applications_processed} app(s)`, '');
    setButtons(false);
    if (state.es) state.es.close();
    return;
  }

  if (event === 'error' && application_id === 'pipeline') {
    showPipelineError(data.message);
    setStatus('Error', 'error');
    setButtons(false);
    return;
  }

  ensureAppCard(application_id);
  const app = state.apps[application_id];

  if (event === 'stage_started') {
    setStageRunning(app, stage);
  } else if (event === 'stage_completed') {
    setStageComplete(app, stage, data);
  } else if (event === 'cot_block') {
    showCoT(app, data.thinking);
  } else if (event === 'eval_score') {
    showScores(app, data);
  } else if (event === 'routing_decision') {
    showRouting(app, data);
    if (data.decision === 'ESCALATE') {
      injectBriefPlaceholder(app);
    }
  } else if (event === 'reviewer_brief') {
    showReviewerBrief(app, data);
  } else if (event === 'error') {
    if (stage === 'reviewer_brief') {
      showBriefError(app, data.message);
    } else {
      showAppError(app, data.message);
    }
  }
}

function ensureAppCard(appId) {
  if (state.apps[appId]) return;

  const main = document.getElementById('main');
  const card = document.createElement('div');
  card.className = 'app-card';
  card.id = `card-${appId}`;
  const header = document.createElement('div');
  header.className = 'app-card-header';
  const title = document.createElement('div'); title.className = 'app-card-title'; title.textContent = appId;
  const riskBadge = document.createElement('div'); riskBadge.className = 'risk-badge risk-pending'; riskBadge.id = `risk-${appId}`; riskBadge.textContent = 'Pending';
  const cardId = document.createElement('div'); cardId.className = 'app-card-id'; cardId.id = `label-${appId}`;
  header.append(title, riskBadge, cardId);
  const body = document.createElement('div'); body.className = 'app-card-body'; body.id = `body-${appId}`;
  card.append(header, body);
  main.appendChild(card);

  // Sidebar entry
  const sidebar = document.getElementById('appList');
  const item = document.createElement('div');
  item.className = 'app-item';
  item.id = `sidebar-${appId}`;
  const sname = document.createElement('div'); sname.className = 'app-name'; sname.textContent = appId;
  const snameId = document.createElement('div'); snameId.className = 'app-id'; snameId.id = `sname-${appId}`;
  const srbadge = document.createElement('div'); srbadge.className = 'risk-badge risk-pending'; srbadge.id = `srbadge-${appId}`; srbadge.style.display = 'none';
  item.append(sname, snameId, srbadge);
  item.onclick = () => card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  sidebar.appendChild(item);

  state.apps[appId] = { card, appId };
}


function setStageRunning(app, stage) {
  ensureStageRow(app, stage);
  const icon = document.getElementById(`icon-${app.appId}-${stage}`);
  const detail = document.getElementById(`detail-${app.appId}-${stage}`);
  if (icon) { icon.className = 'stage-icon running'; icon.textContent = '⟳'; }
  if (detail) detail.textContent = 'Running…';
}

function setStageComplete(app, stage, data) {
  const icon = document.getElementById(`icon-${app.appId}-${stage}`);
  const detail = document.getElementById(`detail-${app.appId}-${stage}`);
  if (icon) { icon.className = 'stage-icon done'; icon.textContent = '✓'; }
  if (detail) {
    if (stage === 'stage0') detail.textContent = `Confidence: ${(data.confidence * 100).toFixed(0)}% — ${data.action || ''}`;
    else if (stage === 'stage1') {
      detail.textContent = `Risk: ${data.risk_level} | Track: ${data.review_track} | Flags: ${data.flags}`;
      updateRiskBadge(app, data.risk_level);
    } else if (stage === 'stage2') detail.textContent = `Complexity: ${data.complexity} | Track: ${data.track}`;
    else if (stage === 'evaluator') detail.textContent = 'Scores computed';
    else if (stage === 'orchestrator') detail.textContent = 'Routing decision ready';
    else detail.textContent = 'Complete';
  }
}

function ensureStageRow(app, stage) {
  if (document.getElementById(`icon-${app.appId}-${stage}`)) return;
  const labels = {
    stage0: ['Stage 0', 'Document Extraction', 'stage0'],
    stage1: ['Stage 1', 'Risk Assessment', 'stage1'],
    stage2: ['Stage 2', 'Onboarding Summary', 'stage2'],
    evaluator: ['Evaluator', 'LLM-as-Judge', 'stage2'],
    orchestrator: ['Orchestrator', 'Routing Decision', 'stage2'],
  };
  const [label, sub, cls] = labels[stage] || [stage, '', ''];
  const body = document.getElementById(`body-${app.appId}`);
  const row = document.createElement('div');
  row.className = `stage ${cls}`;
  row.innerHTML = `
    <div class="stage-icon pending" id="icon-${app.appId}-${stage}">—</div>
    <div class="stage-content">
      <div class="stage-label">${label} — ${sub}</div>
      <div class="stage-detail" id="detail-${app.appId}-${stage}">Waiting…</div>
      <div id="extra-${app.appId}-${stage}"></div>
    </div>`;
  body.appendChild(row);
}

function updateRiskBadge(app, level) {
  const badge = document.getElementById(`risk-${app.appId}`);
  const sbadge = document.getElementById(`srbadge-${app.appId}`);
  if (!badge) return;
  const cls = `risk-badge risk-${level}`;
  badge.className = cls; badge.textContent = level.toUpperCase();
  if (sbadge) { sbadge.className = cls; sbadge.textContent = level.toUpperCase(); sbadge.style.display = ''; }
}

function showCoT(app, thinking) {
  const extra = document.getElementById(`extra-${app.appId}-stage1`);
  if (!extra) return;
  if (extra.querySelector('.cot-toggle')) return; // already shown
  const toggle = document.createElement('div');
  toggle.className = 'cot-toggle';
  toggle.textContent = '▶ View Reasoning';
  const block = document.createElement('pre');
  block.className = 'cot-block';
  block.textContent = thinking || 'Reasoning not available';
  toggle.onclick = () => {
    const vis = block.classList.toggle('visible');
    toggle.textContent = vis ? '▼ Hide Reasoning' : '▶ View Reasoning';
  };
  extra.appendChild(toggle);
  extra.appendChild(block);
}

function showScores(app, data) {
  ensureStageRow(app, 'evaluator');
  const extra = document.getElementById(`extra-${app.appId}-evaluator`);
  if (!extra) return;
  extra.innerHTML = '';
  const scores = [
    ['RA Overall Quality', data.ra_overall],
    ['RA Reasoning', data.ra_reasoning],
    ['RA Completeness', data.ra_completeness],
    ['Summary Quality', data.os_overall],
  ];
  scores.forEach(([label, val]) => {
    if (val == null) return;
    const pct = Math.min(100, Math.max(0, val));
    const colorCls = pct >= 80 ? 'good' : pct >= 60 ? 'ok' : 'low';
    const row = document.createElement('div'); row.className = 'score-row';
    const lbl = document.createElement('div'); lbl.className = 'score-label'; lbl.textContent = label;
    const wrap = document.createElement('div'); wrap.className = 'score-bar-wrap';
    const bar = document.createElement('div'); bar.className = `score-bar ${colorCls}`; bar.style.width = `${pct}%`;
    wrap.appendChild(bar);
    const val_ = document.createElement('div'); val_.className = 'score-val'; val_.textContent = String(pct);
    row.append(lbl, wrap, val_);
    extra.appendChild(row);
  });
}

function showRouting(app, data) {
  ensureStageRow(app, 'orchestrator');
  const extra = document.getElementById(`extra-${app.appId}-orchestrator`);
  if (!extra) return;
  const badge = document.createElement('div');
  badge.className = `routing-badge routing-${data.decision}`;
  badge.textContent = (data.decision || '').replace('_', ' ');
  const rationale = document.createElement('div');
  rationale.className = 'routing-rationale';
  rationale.textContent = data.rationale || '';
  extra.append(badge, rationale);
  if (data.conditions && data.conditions.length > 0) {
    const ul = document.createElement('ul');
    ul.style.cssText = 'margin-top:6px;padding-left:16px;font-size:11px;color:#94a3b8;';
    data.conditions.forEach(c => {
      const li = document.createElement('li'); li.textContent = c; ul.appendChild(li);
    });
    extra.appendChild(ul);
  }
}

function injectBriefPlaceholder(app) {
  if (document.getElementById(`brief-${app.appId}`)) return;
  const card = document.getElementById(`card-${app.appId}`);
  if (!card) return;
  const div = document.createElement('div');
  div.id = `brief-${app.appId}`;
  div.className = 'reviewer-brief';
  const gen = document.createElement('span');
  gen.className = 'reviewer-brief-generating';
  gen.textContent = 'Generating reviewer brief…';
  div.appendChild(gen);
  card.appendChild(div);
}

function showReviewerBrief(app, data) {
  const el = document.getElementById(`brief-${app.appId}`);
  if (!el) return;
  el.innerHTML = '';

  function section(title, content) {
    const h = document.createElement('h4'); h.textContent = title; el.appendChild(h);
    el.appendChild(content);
  }

  const summary = document.createElement('p');
  summary.textContent = data.executive_summary || '';
  section('Summary', summary);

  if (data.primary_risk_factors && data.primary_risk_factors.length) {
    const ul = document.createElement('ul');
    data.primary_risk_factors.forEach(f => { const li = document.createElement('li'); li.textContent = f; ul.appendChild(li); });
    section('Risk Factors', ul);
  }

  if (data.verification_checklist && data.verification_checklist.length) {
    const ul = document.createElement('ul');
    data.verification_checklist.forEach(c => {
      const li = document.createElement('li');
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.style.marginRight = '6px';
      li.appendChild(cb); li.appendChild(document.createTextNode(c));
      ul.appendChild(li);
    });
    section('Verification Checklist', ul);
  }

  if (data.suggested_next_steps && data.suggested_next_steps.length) {
    const ul = document.createElement('ul');
    data.suggested_next_steps.forEach(s => { const li = document.createElement('li'); li.textContent = s; ul.appendChild(li); });
    section('Next Steps', ul);
  }

  if (data.regulatory_notes) {
    const p = document.createElement('p'); p.textContent = data.regulatory_notes;
    section('Regulatory Notes', p);
  }
}

function showBriefError(app, message) {
  const el = document.getElementById(`brief-${app.appId}`);
  if (!el) return;
  el.innerHTML = '';
  const span = document.createElement('span');
  span.style.cssText = 'font-size:12px;color:#ef4444;font-style:italic;';
  span.textContent = `Brief unavailable: ${message}`;
  el.appendChild(span);
}

function showAppError(app, message) {
  const body = document.getElementById(`body-${app.appId}`);
  const err = document.createElement('div');
  err.className = 'error-banner';
  err.textContent = `Error: ${message}`;
  body.appendChild(err);
}

function showPipelineError(message) {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const err = document.createElement('div');
  err.className = 'error-banner';
  err.style.margin = '20px';
  err.textContent = `Pipeline error: ${message}`;
  main.appendChild(err);
}
</script>
</body>
</html>
